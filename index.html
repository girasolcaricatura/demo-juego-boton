:root{--red:#e3122b;--red2:#ff2a40}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
body{font-family:'Geo',sans-serif;color:#fff}
#stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse 70% 75% at 50% 55%,#5e0815 0%,#2c030a 42%,#0b0003 78%,#000 100%)}
#stage.shake{animation:shake .38s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-3px)}30%,50%,70%{transform:translate(-7px,4px)}40%,60%{transform:translate(7px,-4px)}}
#rays{position:absolute;left:50%;top:52%;width:170vmax;height:170vmax;transform:translate(-50%,-50%);
  background:repeating-conic-gradient(from 0deg,rgba(255,40,60,.09) 0deg 5deg,transparent 5deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 0%,rgba(0,0,0,.6) 25%,transparent 55%);mask:radial-gradient(circle,#000 0%,rgba(0,0,0,.6) 25%,transparent 55%);
  animation:spin 40s linear infinite;opacity:.55;transition:opacity .8s}
.s-play #rays{opacity:.8}.s-final.win #rays{opacity:1;animation-duration:12s}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#fx{z-index:5}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65) 100%);z-index:6}

/* ---------- LATA ---------- */
#canWrap{position:absolute;left:50%;top:54%;height:60vh;aspect-ratio:1/3;transform:translate(-50%,-50%);z-index:3;
  transition:left .75s cubic-bezier(.2,.85,.2,1),top .75s cubic-bezier(.2,.85,.2,1),height .75s cubic-bezier(.2,.85,.2,1),opacity .5s;
  filter:drop-shadow(0 2vh 3vh rgba(0,0,0,.7))}
#canWrap svg{width:100%;height:100%;overflow:visible;display:block}
.s-intro #canWrap,.s-final #canWrap{opacity:0;height:40vh}
@media (orientation:landscape){.s-play #canWrap,.s-ready #canWrap,.s-stopped #canWrap{top:49%;height:55vh}.s-msg #canWrap{left:29%;top:50%;height:64vh}
  #final .logo{width:20vmin}#final .lab{margin-top:1.5vmin}#final .score{font-size:10vmin}#minis .m div{height:13vh}#minis{margin:1.5vmin 0 0}#res h2{font-size:5.5vmin;margin-top:1.5vmin}#res .r1{font-size:3.4vmin;margin-top:1.4vmin}.again{margin-top:1.8vmin}#final{padding-bottom:17vmin}}
@media (orientation:portrait){.s-play #canWrap{height:min(58vh,135vw)}.s-msg #canWrap{left:50%;top:34%;height:42vh}}

/* ---------- HUD ---------- */
#hud{position:absolute;top:4vh;left:0;right:0;text-align:center;z-index:7;transition:opacity .4s,transform .4s}
.s-intro #hud,.s-final #hud,.s-msg #hud{opacity:0;transform:translateY(-2vh)}
#lvTitle{font-family:'Monument';font-weight:800;font-size:5.2vmin;letter-spacing:.02em;text-shadow:0 0 2vmin rgba(255,40,60,.5)}
#lvSub{font-weight:400;font-size:2.4vmin;letter-spacing:.25em;color:#bbb;margin-top:.6vmin}
.dots{display:flex;gap:1.6vmin;justify-content:center;margin-top:1.6vmin}
.dots i{width:2vmin;height:2vmin;border-radius:50%;border:.35vmin solid #bbb;transition:all .3s}
.dots i.on{background:var(--red);border-color:var(--red);box-shadow:0 0 1.5vmin var(--red2)}
.dots i.cur{background:#fff;border-color:#fff;box-shadow:0 0 1.5vmin #fff}

/* ---------- MENSAJE MARCA ---------- */
#msg{position:absolute;z-index:7;text-align:center;opacity:0;pointer-events:none;transition:opacity .5s .25s,transform .6s .25s cubic-bezier(.2,.85,.2,1)}
@media (orientation:landscape){#msg{left:50%;width:44%;top:50%;transform:translate(6vw,-50%)}.s-msg #msg{opacity:1;transform:translate(0,-50%)}}
@media (orientation:portrait){#msg{left:5%;width:90%;top:58%;transform:translateY(4vh)}.s-msg #msg{opacity:1;transform:none}}
#msg h2{font-family:'Monument';font-weight:800;color:var(--red);font-size:6.4vmin;line-height:1.1;text-shadow:0 0 3vmin rgba(227,18,43,.55)}
#msg h2.long{font-size:4.6vmin}
#msg .l1{font-weight:700;font-size:3.6vmin;margin-top:3vmin;letter-spacing:.02em}
#msg .l2{font-weight:700;font-size:3.6vmin;color:#c9c9c9;margin-top:.6vmin}
#msg .tag{display:inline-block;margin-top:3vmin;padding:.8vmin 2.4vmin;border:.3vmin solid rgba(255,255,255,.35);border-radius:10vmin;font-weight:700;font-size:2.4vmin;letter-spacing:.18em;color:#ddd}
#msg .tag b{color:#fff}
#msg img{display:block;width:24vmin;margin:4vmin auto 0}

/* ---------- POP PORCENTAJE ---------- */
#pop{position:absolute;left:50%;top:47%;z-index:8;transform:translate(-50%,-50%) scale(.3);opacity:0;text-align:center;pointer-events:none}
#pop.show{animation:pop 1.15s cubic-bezier(.2,1.4,.3,1) forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}
#pop .n{font-family:'Monument';font-weight:800;font-size:15vmin;line-height:1;text-shadow:0 0 3vmin var(--red2),0 0 1vmin #fff}
#pop .w{font-family:'Monument';font-weight:800;font-size:4.6vmin;color:#fff;background:var(--red);padding:.6vmin 2.4vmin;margin-top:1.4vmin;display:inline-block;transform:skewX(-10deg);box-shadow:0 0 3vmin rgba(255,40,60,.7)}

/* ---------- CUENTA ---------- */
#cd{position:absolute;left:50%;top:54%;z-index:8;transform:translate(-50%,-50%);font-family:'Monument';font-weight:800;font-size:12vmin;white-space:nowrap;pointer-events:none;opacity:0;text-shadow:0 0 3vmin var(--red2),0 .5vmin 2vmin #000}
#cd.go{animation:cd .8s cubic-bezier(.2,1.2,.3,1) forwards}
@keyframes cd{0%{opacity:0;transform:translate(-50%,-50%) scale(2.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.7)}}

/* ---------- PANTALLAS ---------- */
.screen{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4vmin 5vmin 20vmin;opacity:0;pointer-events:none;transition:opacity .6s}
.screen .logo{width:48vmin;filter:drop-shadow(0 0 2vmin rgba(255,40,60,.35))}
#intro h1{font-family:'Monument';font-weight:800;line-height:1.05;margin-top:5vmin}
#intro h1 .a{display:block;font-size:8vmin}
#intro h1 .b{display:block;font-size:9vmin;color:var(--red);text-shadow:0 0 3vmin rgba(227,18,43,.6);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{text-shadow:0 0 6vmin rgba(255,40,60,.95),0 0 1vmin rgba(255,120,130,.6)}}
#intro .ins{font-weight:700;font-size:3.5vmin;margin-top:4vmin;line-height:1.35}
#intro .sm{font-weight:700;font-size:2.5vmin;color:#aaa;letter-spacing:.12em;margin-top:3vmin}
.s-intro #intro,.s-final #final{opacity:1}
#final .logo{width:30vmin}
#final .lab{font-weight:700;font-size:2.8vmin;letter-spacing:.3em;color:#bbb;margin-top:3vmin}
#final .score{font-family:'Monument';font-weight:800;font-size:13vmin;line-height:1;text-shadow:0 0 3vmin var(--red2)}
#final .score small{font-size:4vmin;color:#999;text-shadow:none}
#minis{display:flex;gap:6vmin;justify-content:center;margin:3vmin 0 1vmin}
#minis .m{display:flex;flex-direction:column;align-items:center}
#minis .m div{height:17vh;aspect-ratio:1/3}
#minis .m svg{width:100%;height:100%;overflow:visible}
#minis .m span{font-family:'Monument';font-weight:800;font-size:2.6vmin;margin-top:1.4vmin}
#minis .m em{font-style:normal;font-weight:700;font-size:1.9vmin;color:#999;letter-spacing:.15em}
#res{opacity:0;transform:scale(.8);transition:all .5s cubic-bezier(.2,1.4,.3,1)}
#res.show{opacity:1;transform:none}
#res h2{font-family:'Monument';font-weight:800;font-size:7vmin;margin-top:2vmin}
.win #res h2{color:#fff;background:var(--red);display:inline-block;padding:.4vmin 3vmin;transform:skewX(-10deg);box-shadow:0 0 4vmin rgba(255,40,60,.8)}
.lose #res h2{color:var(--red)}
#res .r1{font-family:'Monument';font-weight:800;font-size:4.2vmin;margin-top:2.4vmin}
#res .r2{font-weight:700;font-size:3vmin;color:#c9c9c9;margin-top:1vmin;letter-spacing:.04em}
.again{font-weight:700;font-size:2.2vmin;letter-spacing:.3em;color:#888;margin-top:3vmin;opacity:0}
.again.show{opacity:1;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}

/* ---------- BOTÓN ---------- */
#btn{position:absolute;left:50%;bottom:5vh;z-index:10;width:13vmin;height:13vmin;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#ff6b78 0%,#e3122b 38%,#8d0614 100%);border:.9vmin solid #fff;
  box-shadow:0 0 0 .6vmin rgba(227,18,43,.5),0 0 4vmin rgba(255,40,60,.8),inset 0 -1vmin 2vmin rgba(0,0,0,.4);transition:opacity .4s,transform .08s}
#btn::after{content:'';position:absolute;inset:-2.4vmin;border-radius:50%;border:.4vmin solid rgba(255,60,75,.8);animation:ring 1.3s ease-out infinite}
@keyframes ring{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.5);opacity:0}}
#btn.down{transform:translateX(-50%) scale(.86)}
.s-msg #btn,.s-ready #btn,.s-stopped #btn{opacity:.25}.s-msg #btn::after,.s-ready #btn::after,.s-stopped #btn::after{display:none}
.s-final #btn{opacity:0;pointer-events:none}

#flash{position:absolute;inset:0;background:#fff;z-index:11;opacity:0;pointer-events:none}
#flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.75}100%{opacity:0}}
#mute{position:absolute;right:2vmin;top:2vmin;z-index:12;font-size:1.8vmin;color:#555;letter-spacing:.2em;font-weight:700;display:none}
</style>
</head>

  <text transform="translate(30,575) rotate(-90)" font-family="Geo" font-size="8" fill="rgba(255,255,255,.8)">CONT. NETO 355 ml</text>
  ${drops}
 </g>
 <path d="${bot}" fill="url(#rm${u})"/>
 <path d="${bodyP}" fill="url(#sp${u})"/>
 <path d="${bodyP}" fill="url(#vs${u})"/>
</g>
</svg>`;
}
$('canWrap').innerHTML=makeCan('M');
const svgMain=$('canWrap').firstElementChild, frMain=$('frM');
function setFillEl(el,p){p=Math.max(0,Math.min(1,p));el.setAttribute('y',FILL_BOT-p*FILL_RANGE);el.setAttribute('height',p*FILL_RANGE+12);}

/* ---------- CANVAS ---------- */
const bgc=$('bg'),bx=bgc.getContext('2d'),fxc=$('fx'),fx=fxc.getContext('2d');
let W,H,K,DPR;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;K=Math.min(W,H)/800;
  for(const c of [bgc,fxc]){c.width=W*DPR;c.height=H*DPR;}
  bx.setTransform(DPR,0,0,DPR,0,0);fx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

const embers=[];for(let i=0;i<90;i++)embers.push({x:Math.random(),y:Math.random(),s:.4+Math.random()*1.6,v:.02+Math.random()*.06,ph:Math.random()*6});
let sparks=[];
const COLS=['#ffffff','#fff2c4','#ffd27a','#ff9a3c','#ff4a5c','#ff2a40'];
function spark(x,y,vx,vy,life,size){sparks.push({x,y,vx,vy,l:life,m:life,s:size,c:COLS[(Math.random()*COLS.length)|0]});}
function canRect(){const r=svgMain.getBoundingClientRect();return{x:r.left,y:r.top,w:r.width,h:r.height,s:r.height/600};}
function burst(cr,y,n){const x0=cr.x-cr.w*.15,x1=cr.x+cr.w*1.15;
  for(let i=0;i<n;i++){const x=x0+Math.random()*(x1-x0),a=Math.random()*Math.PI*2,sp=(200+Math.random()*900)*K;
    spark(x,y,Math.cos(a)*sp,Math.sin(a)*sp-200*K,.5+Math.random()*.9,(1+Math.random()*2.5)*K);}}
function fountain(){for(const side of [0,1]){const x=side?W*.92:W*.08;for(let i=0;i<4;i++){
  spark(x,H,(side?-1:1)*(80+Math.random()*350)*K,-(700+Math.random()*700)*K,1+Math.random()*.8,(1.2+Math.random()*2)*K);}}}

/* ---------- AUDIO ---------- */
let AC=null,master,muted=true,hum=null,noiseBuf;
function audioInit(){
  if(AC){AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=muted?0:.55;master.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*.6,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function humStart(){if(!AC)return;humStop();const t=AC.currentTime;
  const o1=AC.createOscillator(),o2=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();
  o1.type='sawtooth';o2.type='square';o2.detune.value=-1200+7;f.type='lowpass';f.Q.value=6;f.frequency.value=600;g.gain.value=0;
  o1.connect(f);o2.connect(f);f.connect(g).connect(master);o1.start();o2.start();g.gain.setTargetAtTime(.09,t,.05);
  hum={o1,o2,f,g};}
function humSet(p){if(!hum)return;const t=AC.currentTime,fr=80+p*480;
  hum.o1.frequency.setTargetAtTime(fr,t,.015);hum.o2.frequency.setTargetAtTime(fr,t,.015);hum.f.frequency.setTargetAtTime(400+p*3200,t,.02);}
function humStop(){if(!hum)return;const h=hum;hum=null;const t=AC.currentTime;h.g.gain.setTargetAtTime(0,t,.03);setTimeout(()=>{try{h.o1.stop();h.o2.stop();}catch(e){}},300);}
function tone(f,dur,type='square',vol=.12,when=0,f2){if(!AC)return;const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(master);o.start(t);o.stop(t+dur+.05);}
function zap(){if(!AC)return;const t=AC.currentTime,n=AC.createBufferSource(),bp=AC.createBiquadFilter(),g=AC.createGain();
  n.buffer=noiseBuf;bp.type='bandpass';bp.Q.value=1.2;bp.frequency.setValueAtTime(5000,t);bp.frequency.exponentialRampToValueAtTime(300,t+.4);
  g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.45);n.connect(bp).connect(g).connect(master);n.start(t);
  tone(900,.35,'sawtooth',.15,0,60);tone(60,.4,'sine',.4,0,35);}
const sfx={
  click:()=>tone(1200,.06,'square',.08),
  lvl:()=>{tone(300,.12,'square',.08);tone(450,.12,'square',.08,.1);tone(680,.2,'square',.08,.2);},
  go:()=>tone(880,.25,'sawtooth',.1,0,1760),
  perfect:()=>[1046,1318,1568,2093].forEach((f,i)=>tone(f,.25,'square',.07,i*.06)),
  tick:()=>tone(1800+Math.random()*400,.03,'triangle',.05),
  win:()=>[523,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,.3,'square',.08,i*.11)),
  lose:()=>{tone(440,.3,'sawtooth',.09);tone(330,.5,'sawtooth',.09,.28,220);}
};

/* ---------- ESTADO ---------- */
let state='intro',level=0,scores=[],p=0,phase=0,dir=1,playT=0,lockUntil=0,timers=[],drain=null,lineAlpha=0,lastTick=0;
const now=()=>performance.now();
function later(fn,ms){timers.push(setTimeout(fn,ms));}
function clearTimers(){timers.forEach(clearTimeout);timers=[];}
function setState(s,extra=''){state=s;body.className='s-'+s+(extra?' '+extra:'');}

function updDots(){[...$('dots').children].forEach((d,i)=>{d.className=i<level?'on':(i===level?'cur':'');});}
function countdown(txt,ms){const c=$('cd');c.textContent=txt;c.classList.remove('go');void c.offsetWidth;c.style.animationDuration=ms+'ms';c.classList.add('go');}

function startGame(){clearTimers();scores=[];level=0;beginLevel();}
function beginLevel(){
  const L=NIVELES[level];setState('ready');
  $('lvTitle').textContent=L.t;$('lvSub').textContent=L.s;updDots();
  drain={from:p,t0:now(),d:450};phase=0;dir=1;
  later(()=>{countdown('NIVEL '+(level+1),900);sfx.lvl();},250);
  later(()=>{countdown('¡YA!',600);sfx.go();},1250);
  later(()=>{p=0;phase=0;playT=0;setState('play');humStart();},1550);
}
function stopFill(){
  humStop();setState('stopped');
  let sc=Math.round(p*100);const perfect=sc>=CONFIG.perfecto;if(perfect)sc=100;scores.push(sc);
  const word=perfect?'¡PERFECTO!':sc>=90?'¡GENIAL!':sc>=75?'¡BIEN!':sc>=50?'¡CASI!':'¡UPS!';
  $('popN').textContent=sc+'%';$('popW').textContent=word;
  const pp=$('pop');pp.classList.remove('show');void pp.offsetWidth;pp.classList.add('show');
  const fl=$('flash');fl.classList.remove('go');void fl.offsetWidth;fl.classList.add('go');
  stage.classList.remove('shake');void stage.offsetWidth;stage.classList.add('shake');
  const cr=canRect();burst(cr,lineY(cr,p),perfect?320:180);zap();if(perfect)sfx.perfect();
  later(showMsg,1250);
}
function showMsg(){
  const L=NIVELES[level],sc=scores[level];
  $('mT').textContent=L.h;$('mT').className=L.h.length>10?'long':'';$('m1').textContent=L.a;$('m2').textContent=L.b;
  $('mTag').innerHTML='NIVEL '+(level+1)+' · <b>'+sc+'%</b>';
  setState('msg');lockUntil=now()+1300;later(nextLevel,CONFIG.msgSeg*1000);
}
function nextLevel(){clearTimers();level++;if(level<3)beginLevel();else showFinal();}
function showFinal(){
  const tot=scores.reduce((a,b)=>a+b,0),win=tot>=CONFIG.premio;
  setState('final',win?'win':'lose');lockUntil=now()+3200;
  const m=$('minis');m.innerHTML='';
  scores.forEach((s,i)=>{const d=document.createElement('div');d.className='m';
    d.innerHTML=`<div>${makeCan('m'+i)}</div><span>${s}%</span><em>NIVEL ${i+1}</em>`;m.appendChild(d);});
  scores.forEach((s,i)=>{const el=$('frm'+i);setFillEl(el,0);later(()=>animFill(el,s/100,600),500+i*350);});
  $('res').classList.remove('show');$('again').classList.remove('show');
  const t0=now();(function cnt(){const k=Math.min(1,(now()-t0)/1500);$('tot').textContent=Math.round(tot*(1-Math.pow(1-k,3)));if(k<1&&state==='final')requestAnimationFrame(cnt);})();
  const T=win?TXT.win:TXT.lose;$('rT').textContent=T.h;$('r1').textContent=T.a;$('r2').textContent=T.b;
  later(()=>{$('res').classList.add('show');win?sfx.win():sfx.lose();if(win){winUntil=now()+4000;}},1700);
  later(()=>{$('again').classList.add('show');body.classList.add('ready2');},3200);
  later(toIntro,CONFIG.volverSeg*1000);
}
let winUntil=0;
function animFill(el,to,ms){const t0=now();(function f(){const k=Math.min(1,(now()-t0)/ms);setFillEl(el,to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f);else sfx.tick();})();}
function toIntro(){clearTimers();humStop();p=0;setFillEl(frMain,0);setState('intro');}

function press(){
  if(now()<lockUntil)return;
  const b=$('btn');b.classList.add('down');setTimeout(()=>b.classList.remove('down'),120);
  audioInit();
  switch(state){
    case 'intro': sfx.click();startGame();break;
    case 'play': stopFill();break;
    case 'msg': sfx.click();nextLevel();break;
    case 'final': sfx.click();toIntro();break;
  }
}
addEventListener('pointerdown',e=>{e.preventDefault();press();});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  if(e.repeat)return;const k=e.key.toLowerCase();
  if(k==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});return;}
  if(k==='m'){muted=!muted;$('mute').style.display=muted?'block':'none';if(master)master.gain.value=muted?0:.55;return;}
  e.preventDefault();press();
});

/* ---------- LOOP ---------- */
function lineY(cr,pp){return cr.y+(FILL_BOT-pp*FILL_RANGE)*cr.s;}
function bolt(x0,x1,y,amp,alpha){fx.beginPath();fx.moveTo(x0,y);let x=x0;while(x<x1){x+=(8+Math.random()*16)*K;fx.lineTo(Math.min(x,x1),y+(Math.random()*2-1)*amp);}
  fx.strokeStyle=`rgba(255,215,220,${alpha})`;fx.lineWidth=1.2*K;fx.shadowColor='#ff3048';fx.shadowBlur=10*K;fx.stroke();}

let last=now();
function loop(){
  const t=now(),dt=Math.min(.05,(t-last)/1000);last=t;

  // lógica
  if(state==='play'){
    playT+=dt;phase+=dt*CONFIG.velocidades[level];
    p=phase%1;dir=1;humSet(p);
    if(playT>CONFIG.autoStop)stopFill();
  }else if(drain){const k=Math.min(1,(t-drain.t0)/drain.d);p=drain.from*(1-k);if(k>=1)drain=null;}
  setFillEl(frMain,p);

  // fondo: brasas
  bx.clearRect(0,0,W,H);
  const boost=state==='play'?1+level*1.2:(state==='final'&&body.classList.contains('win')?2.5:1);
  for(const e of embers){e.y-=e.v*dt*boost;if(e.y<-.02){e.y=1.02;e.x=Math.random();}
    const fl=.35+.35*Math.sin(t/300+e.ph);bx.fillStyle=`rgba(255,${60+(e.s*40|0)},${50},${fl*.7})`;
    bx.beginPath();bx.arc(e.x*W+Math.sin(t/900+e.ph)*12*K,e.y*H,e.s*K*1.6,0,7);bx.fill();}

  // fx
  fx.clearRect(0,0,W,H);fx.globalCompositeOperation='lighter';
  const showLine=['ready','play','stopped','msg'].includes(state);
  lineAlpha+=((showLine?1:0)-lineAlpha)*Math.min(1,dt*8);
  if(lineAlpha>.01){
    const cr=canRect(),y=lineY(cr,p),x0=cr.x-cr.w*.14,x1=cr.x+cr.w*1.14,live=state==='play';
    const fl=live?.8+Math.random()*.2:1;fx.globalAlpha=lineAlpha;
    // destello anamórfico
    let g=fx.createLinearGradient(x0-cr.w*1.2,0,x1+cr.w*1.2,0);
    g.addColorStop(0,'rgba(255,40,60,0)');g.addColorStop(.5,`rgba(255,90,110,${.35*fl})`);g.addColorStop(1,'rgba(255,40,60,0)');
    fx.fillStyle=g;fx.fillRect(x0-cr.w*1.2,y-1.5*K,(x1-x0)+cr.w*2.4,3*K);
    // halo
    g=fx.createLinearGradient(0,y-26*K,0,y+26*K);g.addColorStop(0,'rgba(255,30,50,0)');g.addColorStop(.5,`rgba(255,40,60,${.45*fl})`);g.addColorStop(1,'rgba(255,30,50,0)');
    fx.fillStyle=g;fx.fillRect(x0,y-26*K,x1-x0,52*K);
    // línea
    fx.shadowColor='#ff2a40';fx.shadowBlur=22*K;fx.strokeStyle=`rgba(255,90,100,${fl})`;fx.lineWidth=7*K;
    fx.beginPath();fx.moveTo(x0,y);fx.lineTo(x1,y);fx.stroke();
    fx.shadowColor='#fff';fx.shadowBlur=10*K;fx.strokeStyle='#fff';fx.lineWidth=2.6*K;fx.stroke();
    fx.shadowBlur=0;
    // rayos
    if(live){for(let i=0;i<2+level;i++)bolt(x0,x1,y,(5+level*3)*K,.35+Math.random()*.45);fx.shadowBlur=0;}
    // flares extremos
    for(const ex of [x0,x1]){const R=(live?34+Math.random()*10:26)*K;const rg=fx.createRadialGradient(ex,y,0,ex,y,R);
      rg.addColorStop(0,'rgba(255,255,255,.95)');rg.addColorStop(.25,'rgba(255,120,130,.55)');rg.addColorStop(1,'rgba(255,30,50,0)');
      fx.fillStyle=rg;fx.beginPath();fx.arc(ex,y,R,0,7);fx.fill();}
    // emisión de chispas
    if(live){const rate=(70+level*80)*dt;let n=rate|0;if(Math.random()<rate-n)n++;
      for(let i=0;i<n;i++){
        if(Math.random()<.6){const side=Math.random()<.5?0:1,ex=side?x1:x0;
          spark(ex,y,(side?1:-1)*(120+Math.random()*480)*K,(-dir*Math.random()*260+(Math.random()*2-1)*140)*K,.25+Math.random()*.55,(1+Math.random()*1.8)*K);}
        else{spark(x0+Math.random()*(x1-x0),y,(Math.random()*2-1)*160*K,-dir*(80+Math.random()*380)*K,.2+Math.random()*.4,(.8+Math.random()*1.5)*K);}
      }}
    else if(state==='msg'&&Math.random()<.5){const side=Math.random()<.5,ex=side?x1:x0;spark(ex,y,(side?1:-1)*(60+Math.random()*160)*K,(Math.random()*2-1)*80*K,.3+Math.random()*.4,(.8+Math.random())*K);}
    fx.globalAlpha=1;
  }
  if(state==='final'&&t<winUntil)fountain();
  // chispas
  const G=900*K;
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.l-=dt;if(s.l<=0){sparks.splice(i,1);continue;}
    s.vy+=G*dt;s.vx*=.985;s.x+=s.vx*dt;s.y+=s.vy*dt;const a=s.l/s.m;
    fx.globalAlpha=a;fx.strokeStyle=s.c;fx.lineWidth=s.s;fx.beginPath();fx.moveTo(s.x,s.y);fx.lineTo(s.x-s.vx*.028,s.y-s.vy*.028);fx.stroke();}
  if(sparks.length>1500)sparks.splice(0,sparks.length-1500);
  fx.globalAlpha=1;fx.globalCompositeOperation='source-over';
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
